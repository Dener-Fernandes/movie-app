<div class="pagination">
  <button
    class="page-btn"
    [class.disabled]="currentPage() === 0"
    (click)="goToPage(currentPage() - 1)"
  >
    ‹
  </button>

  @for (page of pages; track page) {
  <button
    class="page-btn"
    [class.active]="page === currentPage()"
    (click)="goToPage(page)"
  >
    {{ page + 1 }}
  </button>
  }

  <button
    class="page-btn"
    [class.disabled]="currentPage() === totalPages() - 1"
    (click)="goToPage(currentPage() + 1)"
  >
    ›
  </button>
</div>
